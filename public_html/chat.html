<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070910">
<title>Chat — Te Liga Aí</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="/css/cadastro.css">
<link rel="stylesheet" href="/css/conta.css">
<script src="/js/api.js" defer></script>
<script src="/js/chat.js" type="module"></script>
</head>
<body>
<main class="cad larga">
<div class="linha-acoes">
<a class="cad-voltar" href="/perfil.html">‹ Meu perfil</a>
</div>
<p class="erro geral" id="erro-geral" role="alert"></p>
<div class="chat" id="chat" hidden>
<section class="cad-card">
<h2>Conversas</h2>
<ul class="conversas" id="conversas"></ul>
<p class="vazio" id="sem-conversas">Nenhuma conversa ainda. Abra o perfil de uma loja e toque em “Conversar”.</p>
</section>
<section class="cad-card">
<h2 id="titulo-conversa">Escolha uma conversa</h2>
<div class="mensagens" id="mensagens" aria-live="polite"></div>
<form class="form-msg" id="form-msg" hidden>
<input id="texto" maxlength="2000" autocomplete="off" placeholder="Escreva uma mensagem" aria-label="Mensagem">
<button class="btn" type="submit">Enviar</button>
</form>
</section>
</div>
</main>
</body>
</html>
